[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "real-gas-eos"
version = "0.1.0"
description = "Cubic equations of state for real gases: compressibility, fugacity, vapour pressure and departure functions"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Luis Rodriguez" }]
requires-python = ">=3.9"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
notebooks = ["matplotlib", "jupyter"]

[tool.setuptools]
packages = ["realgas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
